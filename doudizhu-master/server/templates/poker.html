<!doctype html>
<html lang="en"> 
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>斗地主 - 人机对战</title>
<script type="text/javascript" src="{{static_url('js/phaser.min.js')}}"></script>
<script type="text/javascript" src="{{static_url('js/phaser-input.min.js')}}"></script>
<style type="text/css">
html, body { width:100%; height:100%; padding:0; margin:0; background-color:black; overflow:hidden; }
#game { margin:auto; width:100%; height:100%; }
</style>
</head>
<body>
<div id="game"></div>
<div id="orientation"></div>
<script type="module">
import {Boot, Preloader, GameScene} from '/static/js/boot.mjs?v=5'
import {Game} from '/static/js/game.mjs?v=5'
(function () {
    const game = new Phaser.Game(960, 540, Phaser.AUTO, 'game');
    game.state.add('Boot', Boot);
    game.state.add('Preloader', Preloader);
    game.state.add('GameScene', GameScene);
    game.state.add('Game', Game);
    game.state.start('Boot');
})();
</script>
</body>
</html>
